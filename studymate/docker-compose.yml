# StudyMate 一键启动（本地 + Ubuntu 公网共用）
# ===========================================================
# 本地开箱即用：
#   1. cp .env.example backend/.env   （已有 backend/.env 可跳过）
#   2. bash scripts/deploy.sh
#   3. 浏览器打开 http://localhost:5173
#
# 公网部署：复制 .deploy.env.example 为 .deploy.env，填备案域名后运行同一脚本；
# .deploy.env 中的 COMPOSE_PROFILES=public,code-runner 会额外启用 Caddy/Piston。
# 默认本地基础栈为 backend + frontend（SQLite + BM25/语义向量混合检索）。
# PostgreSQL、Redis、Chroma 扩展服务使用 extras Profile：
#   docker compose --profile extras up -d
# ===========================================================

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        PYTHON_IMAGE: "${PYTHON_IMAGE:-python:3.11-slim}"
        DEBIAN_MIRROR: "${DEBIAN_MIRROR:-http://mirrors.aliyun.com/debian}"
        DEBIAN_SECURITY_MIRROR: "${DEBIAN_SECURITY_MIRROR:-http://mirrors.aliyun.com/debian-security}"
        PIP_INDEX_URL: "${PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple}"
    image: studymate-backend:latest
    container_name: studymate-backend
    restart: "no"
    ports:
      # 仅供宿主机排障；公网入口统一由 Caddy 转发，安全组无需开放 8000。
      - "127.0.0.1:8000:8000"
    env_file:
      # 与本地裸跑共用同一份 key（backend/.env），避免两份 .env 漂移。
      # 不存在则跳过；未配置的外部能力使用项目兜底或返回明确提示。
      # Dockerfile 不 COPY .env，真实 Key 不进入镜像。
      - path: ./backend/.env
        required: false
    environment:
      # 在线代码运行沙箱（同一 docker 网络内访问，不出公网）
      PISTON_URL: "http://piston-api:2000"
      # 数据库落到挂载的 volume（/app/data），重部署不丢用户数据。
      # docker_entrypoint.py 首启时从镜像中的压缩种子库解压到这里。
      DATABASE_URL: "sqlite:///./data/studymate.db"
    volumes:
      # backend_data 命名 volume 持久化数据库 + 上传文件，跨 `--build`/容器重建保留。
      # 普通重建不会覆盖数据。删除卷会永久清除用户数据，只能在明确备份后的重置场景执行。
      - backend_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  # 在线代码沙箱（Piston）：C / C++17 / Python 一键运行
  # ============================================================
  # 国内拉镜像慢？给 Docker daemon 配镜像加速：
  #   /etc/docker/daemon.json -> "registry-mirrors": ["https://docker.m.daobao.com"]
  # 首次启动后，运行：bash scripts/init-piston.sh （或 powershell）安装 runtime
  # 装完缓存到 piston_data volume，后续启动不再访问境外
  piston-api:
    image: "${PISTON_IMAGE:-ghcr.io/engineer-man/piston:latest}"
    container_name: studymate-piston
    profiles: ["code-runner"]
    restart: "no"
    privileged: true   # Piston 用 isolate 沙箱需要 namespace 权限
    environment:
      # 允许的最大运行墙钟超时（ms）。默认 3000，放宽到 10000 给算法/sklearn 训练用
      PISTON_RUN_TIMEOUT: 10000
      PISTON_COMPILE_TIMEOUT: 15000
      # 公网演示机限制并发和子进程数，防止共享测试账号耗尽宿主机资源。
      PISTON_MAX_CONCURRENT_JOBS: 2
      PISTON_MAX_PROCESS_COUNT: 32
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 256
    # 默认仅暴露给 backend（同 docker 网络），不对外开端口；
    # 如需用 init 脚本从宿主机装 runtime，临时打开下一行 ports 即可
    ports:
      - "127.0.0.1:2000:2000"   # 仅本机访问，公网不可达
    volumes:
      - piston_data:/piston

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NODE_IMAGE: "${NODE_IMAGE:-node:20-alpine}"
        NGINX_IMAGE: "${NGINX_IMAGE:-nginx:alpine}"
    image: studymate-frontend:latest
    container_name: studymate-frontend
    restart: "no"
    ports:
      # 保留本机直连排障，但不暴露到公网网卡。
      - "127.0.0.1:5173:80"
    depends_on:
      backend:
        condition: service_healthy

  # 公网入口：自动 HTTP -> HTTPS、申请并续期 Let's Encrypt 证书。
  # SITE_ADDRESS 默认 http://localhost；服务器上在 .deploy.env 写正式域名。
  caddy:
    image: "${CADDY_IMAGE:-caddy:2-alpine}"
    container_name: studymate-caddy
    profiles: ["public"]
    restart: "no"
    environment:
      SITE_ADDRESS: "${SITE_ADDRESS:-http://localhost}"
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy

  # ===== 以下服务为顶奖版可选栈，默认不启动 =====
  # 启动方式：docker compose --profile extras up -d
  postgres:
    image: postgres:16-alpine
    container_name: studymate-postgres
    profiles: ["extras"]
    environment:
      POSTGRES_USER: studymate
      POSTGRES_PASSWORD: studymate
      POSTGRES_DB: studymate
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studymate"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: studymate-redis
    profiles: ["extras"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data

  chroma:
    image: chromadb/chroma:latest
    container_name: studymate-chroma
    profiles: ["extras"]
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"

networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.242.0/24
          gateway: 192.168.242.1

volumes:
  backend_data:
  piston_data:
  caddy_data:
  caddy_config:
  postgres_data:
  redis_data:
  chroma_data:
