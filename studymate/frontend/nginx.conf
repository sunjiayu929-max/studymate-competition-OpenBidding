# StudyMate 前端 Nginx 配置
# - 静态托管 Vite 产物
# - SPA history 路由回退到 index.html
# - /api 反向代理到后端容器（SSE 长连接需关闭 buffering）

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Tutor attachments / OCR images can be larger than nginx's 1 MiB default.
    client_max_body_size 20m;

    # 静态资源缓存
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Monaco 使用版本化站内路径，避免运行时依赖境外 CDN；升级版本时路径会随之变化。
    location /monaco/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API 反代到后端容器（compose 内部 DNS）
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 关键参数：禁用缓冲 + 长超时
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        chunked_transfer_encoding on;
    }

    # SPA 路由：所有未匹配路径回退 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
